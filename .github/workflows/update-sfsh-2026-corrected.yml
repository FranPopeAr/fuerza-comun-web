name: Update corrected SFSH 2026 results

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sfsh-2026-corrected.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update corrected PDF and work data
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/[[...slug]]/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_id = '1piI9qsBtvwWmqekjsiNA1FDbsrOGyFub'
          new_id = '1XE5MvWRzySQOF8q31dpsnj6FCWsVrjmC'
          if old_id not in text:
              raise SystemExit('Old PDF id not found')
          text = text.replace(old_id, new_id)

          old = '<article><strong>42%</strong><p>de las personas tiene trabajo.</p></article><article><strong>58%</strong><p>que trabaja, y de ese grupo un <b>70%</b> tiene “trabajo temporal”.</p></article>'
          new = '<article><strong>42%</strong><p>de las personas no tiene trabajo.</p></article><article><strong>58%</strong><p>de las personas trabaja, y de ese grupo un <b>70%</b> tiene “trabajo temporal”.</p></article>'
          if old not in text:
              raise SystemExit('Old work-results block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit corrected results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/[[...slug]]/page.tsx'
          git commit -m "Update corrected Santa Fe Sin Hambre 2026 results"
          git push
