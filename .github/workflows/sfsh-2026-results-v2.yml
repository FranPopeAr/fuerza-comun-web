name: Apply Santa Fe Sin Hambre 2026 page

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-sfsh-2026.py'
      - '.github/workflows/sfsh-2026-results-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update-sfsh-2026.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/[[...slug]]/page.tsx' src/app/globals.css
          git commit -m "Publish Santa Fe Sin Hambre 2026 results"
          git push
