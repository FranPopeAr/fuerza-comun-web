name: Add lapices reel feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-lapices-reel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reel to homepage and actualidad
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/[[...slug]]/page.tsx')
          text = page.read_text(encoding='utf-8')

          const_anchor = "const EVENT_IMAGE = 'https://drive.google.com/uc?export=view&id=1nC7Zkl6e_6askx9PAnioEVLTkUFFGjfl';"
          consts = """const EVENT_IMAGE = 'https://drive.google.com/uc?export=view&id=1nC7Zkl6e_6askx9PAnioEVLTkUFFGjfl';\nconst LAPICES_REEL_URL = 'https://www.instagram.com/reel/DdZGBLsRdyn/';\nconst LAPICES_REEL_EMBED = 'https://www.instagram.com/reel/DdZGBLsRdyn/embed';\n"""
          if 'LAPICES_REEL_URL' not in text:
              text = text.replace(const_anchor, consts, 1)

          component_anchor = "function Shell({children}:{children:React.ReactNode}) { return <><Header /><main className=\"internal-page\">{children}</main><Footer /></>; }"
          reel_component = r'''function ReelFeature({compact=false}:{compact?:boolean}) {
  return <article className={compact ? "news-card reel-card" : "reel-feature"}>
    <div className={compact ? "reel-card-media" : "reel-feature-media"}>
      <iframe
        src={LAPICES_REEL_EMBED}
        title="A 50 años, los lápices siguen escribiendo"
        loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
      />
    </div>
    <div className={compact ? "news-body" : "reel-feature-copy"}>
      <span>Memoria</span>
      <h2>A 50 años, los lápices siguen escribiendo</h2>
      <p>Reivindicando la lucha de los compañeros y compañeras de ayer, llenamos las calles para frenarle la mano al negacionimos y la entrega de Milei.</p>
      <a href={LAPICES_REEL_URL} target="_blank" rel="noreferrer">Ver reel en Instagram →</a>
    </div>
  </article>;
}

'''
          if 'function ReelFeature' not in text:
              text = text.replace(component_anchor, component_anchor + '\n\n' + reel_component, 1)

          home_old = '<section className="section section-light"><div className="container"><Heading eyebrow="04 / Ahora" title="Lo que estamos haciendo." /><div className="news-grid">{news.map(n=><article className="news-card" key={n.slug}>'
          home_new = '<section className="section section-light"><div className="container"><Heading eyebrow="04 / Ahora" title="Lo que estamos haciendo." /><div className="news-grid"><ReelFeature compact />{news.map(n=><article className="news-card" key={n.slug}>'
          if '<ReelFeature compact />{news.map' not in text:
              text = text.replace(home_old, home_new, 1)

          news_start = text.index('function News({news}:{news:ArticleData[]})')
          news_end = text.index('function Article({slug, news}', news_start)
          current_news = text[news_start:news_end]
          if '<ReelFeature />' not in current_news:
              replacement = '''function News({news}:{news:ArticleData[]}) { return <Shell><section className="internal-hero"><div className="container"><p className="eyebrow">Actualidad</p><h1>Lo que estamos haciendo ahora.</h1></div></section><section className="section section-light"><div className="container"><ReelFeature /><div className="news-grid">{news.map(n=><article className="news-card" key={n.slug}><div className="news-image"><Image src={n.image} alt={n.imageAlt} fill quality={92} sizes="(max-width: 800px) 100vw, 33vw" style={n.slug===EVENT_SLUG?{objectFit:'contain',background:'#f3f2f0'}:undefined} /></div><div className="news-body"><span>{n.category}</span><h2>{n.title}</h2><p>{n.text}</p><Link href={`/actualidad/${n.slug}`}>Leer más →</Link></div></article>)}</div></div></section></Shell>; }\n'''
              text = text[:news_start] + replacement + text[news_end:]

          page.write_text(text, encoding='utf-8')

          css_path = Path('src/app/globals.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* LAPICES REEL FEATURE */'
          if marker not in css:
              css += r'''

/* LAPICES REEL FEATURE */
.reel-card-media{position:relative;background:#111;aspect-ratio:9/13;overflow:hidden}.reel-card-media iframe{width:100%;height:100%;border:0;display:block}.reel-card .news-body>a,.reel-feature-copy>a{font-weight:800;text-decoration:none;color:var(--ink)}.reel-card .news-body>a:hover,.reel-feature-copy>a:hover{text-decoration:underline}.reel-feature{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:0;margin-bottom:3rem;border:1px solid rgba(46,45,44,.18);background:var(--paper)}.reel-feature-media{background:#111;min-height:640px}.reel-feature-media iframe{width:100%;height:100%;min-height:640px;border:0;display:block}.reel-feature-copy{padding:clamp(2rem,5vw,4.5rem);display:flex;flex-direction:column;justify-content:center}.reel-feature-copy>span{font-family:Consolas,monospace;color:var(--coral);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem}.reel-feature-copy h2{font-size:clamp(2.2rem,5vw,4.8rem);line-height:.98;margin:1rem 0 1.5rem}.reel-feature-copy p{font-size:1.1rem;line-height:1.65;max-width:650px;margin-bottom:2rem}@media(max-width:800px){.reel-feature{grid-template-columns:1fr}.reel-feature-media,.reel-feature-media iframe{min-height:620px}.reel-feature-copy{padding:2rem}.reel-card-media{aspect-ratio:9/14}}
'''
              css_path.write_text(css, encoding='utf-8')

          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','src/app/[[...slug]]/page.tsx','src/app/globals.css'], check=True)
          diff = subprocess.run(['git','diff','--cached','--quiet'])
          if diff.returncode != 0:
              subprocess.run(['git','commit','-m','Feature lapices reel on home and actualidad'], check=True)
              subprocess.run(['git','push'], check=True)
          PY
