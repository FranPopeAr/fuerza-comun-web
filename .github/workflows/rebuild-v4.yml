name: rebuild-v4 build

on:
  push:
    branches: [rebuild-v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4.0.2
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-fund
      - run: npm run build
